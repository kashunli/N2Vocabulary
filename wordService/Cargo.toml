[package]
name = "n2-word-service-rust"
version = "0.1.0"
edition = "2024"
default-run = "n2-word-service-rust"

[dependencies]
anyhow = "1"
argon2 = "0.5"
chrono = { version = "0.4", features = ["clock"] }
mime_guess = "2"
rand = "0.9"
# Password salts use `rand_core` 0.6 through argon's password-hash API. Keep
# its OS-randomness feature explicit rather than relying on an unrelated crate.
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tiny_http = "0.12"
url = "2"

[build-dependencies]
winresource = "0.1"
