<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>N2 wordService</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-main">
      <div>
        <div class="eyebrow">wordService</div>
        <h1 id="page-title">語彙 — Card study</h1>
        <div class="meta" id="summary-meta">Loading vocabulary...</div>
      </div>
      <div class="hero-pickers">
        <label class="unit-picker">
          <span>Book</span>
          <select id="book-select"></select>
        </label>
        <label class="unit-picker">
          <span>Section</span>
          <select id="unit-select"></select>
        </label>
      </div>
    </div>
  </header>

  <nav class="unit-strip" id="unit-strip" aria-label="Sections"></nav>

  <section class="controls">
    <input id="search" type="search" placeholder="Search kanji, reading, meaning, sentence...">
    <div class="pill-group" aria-label="Study state filter">
      <button class="pill state-pill active" data-state="all">All</button>
      <button class="pill state-pill" data-state="unmarked">Unmarked</button>
      <button class="pill state-pill known" data-state="known">Known</button>
      <button class="pill state-pill flagged" data-state="flagged">Flagged</button>
    </div>
    <button class="cover-all" id="cover-all" type="button" aria-pressed="false">cover all</button>
    <button class="starred-view-button" id="starred-view-button" type="button" aria-pressed="false">★ starred sentences</button>
    <button class="audio-export-button" id="audio-export-button" type="button">export flagged audio</button>
    <span class="counter" id="counter"></span>
  </section>

  <div class="status-banner" id="status-banner"></div>

  <main>
    <section id="card-view">
      <div class="grid" id="card-grid"></div>
    </section>

    <section class="starred-view" id="starred-view" hidden>
      <aside class="starred-filter">
        <div class="section-label">Section filter</div>
        <div class="starred-unit-list" id="starred-unit-list"></div>
        <p class="starred-hint">Default review shows starred sentences across all sections. Section view keeps the same starred-only rule.</p>
      </aside>

      <section class="starred-list-panel" id="starred-list-panel">
        <div class="starred-list-head">
          <div>
            <div class="starred-title" id="starred-title">Starred sentences</div>
            <div class="starred-subtitle" id="starred-subtitle"></div>
          </div>
          <div class="starred-count" id="starred-count"></div>
        </div>
        <div class="starred-list" id="starred-list"></div>
        <div class="empty starred-empty" id="starred-empty">No starred sentences yet.</div>
      </section>

      <aside class="starred-detail" id="starred-detail"></aside>
    </section>
  </main>

  <div class="modal-backdrop" id="backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <div>
          <div class="meta" id="modal-meta"></div>
          <div class="kanji" id="modal-title"></div>
        </div>
        <button type="button" class="modal-close" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-actions">
          <button type="button" class="icon-btn known">Known</button>
          <button type="button" class="icon-btn flagged">Flag</button>
        </div>
        <div class="modal-meaning" id="modal-meaning"></div>
        <div>
          <div class="section-label">Sentences</div>
          <div class="sentences" id="modal-sentences"></div>
        </div>
        <div id="modal-explanation-wrap">
          <div class="section-label">Explanation</div>
          <div class="explanation" id="modal-explanation"></div>
        </div>
      </div>
    </div>
  </div>

  <template id="card-template">
    <article class="card">
      <div class="card-top">
        <span class="card-actions">
          <button class="icon-btn sentence-star" type="button" title="Star main sentence">☆</button>
          <button class="icon-btn known" type="button" title="Mark as known">✓</button>
          <button class="icon-btn flagged" type="button" title="Flag for review">⚑</button>
        </span>
      </div>
      <div class="card-kanji"></div>
      <div class="card-meaning"></div>
      <div class="card-sentence"></div>
      <div class="card-sentence-translation"></div>
      <div class="card-bottom">
        <button class="cover-button" type="button">cover</button>
        <button class="details-button" type="button">details</button>
        <span class="card-index"></span>
      </div>
    </article>
  </template>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
