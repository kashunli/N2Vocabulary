name: Deploy WordService

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to deploy, for example v0.1.7
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-word-service
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify, package, and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    env:
      DEPLOY_HOST: ${{ secrets.VPS_HOST }}
      DEPLOY_USER: ${{ secrets.VPS_USER }}
      DEPLOY_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/n2-vocabulary' }}
      DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE || 'n2-word-service.service' }}
      DEPLOY_HEALTHCHECK_URL: ${{ vars.DEPLOY_HEALTHCHECK_URL || 'http://127.0.0.1:8767/api/summary' }}
      # Required only when the VPS does not yet have /etc/n2-word-service.env.
      # DEPLOY_URL remains a compatibility fallback for the existing variable.
      DEPLOY_PUBLIC_ORIGIN: ${{ vars.DEPLOY_PUBLIC_ORIGIN || vars.DEPLOY_URL || '' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve and validate release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must use vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 1
          }
          release_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          [[ "$release_sha" == "$tag_sha" ]] || {
            echo "Checked-out commit does not match $RELEASE_TAG" >&2
            exit 1
          }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Validate deployment configuration
        run: bash .github/scripts/validate-deploy-config.sh

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: wordService/frontend/pnpm-lock.yaml

      - name: Verify frontend
        working-directory: wordService/frontend
        run: pnpm install --frozen-lockfile && pnpm check

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wordService -> target

      - name: Verify and build WordService
        working-directory: wordService
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test

      - name: Build Debian-compatible release binary
        working-directory: wordService
        shell: bash
        env:
          # Debian Bookworm ships glibc 2.36. Building in this image keeps the
          # release runnable on Debian 12 instead of inheriting ubuntu-latest's
          # newer glibc baseline.
          DEBIAN_BUILD_IMAGE: rust:1-bookworm
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp/n2-vocabulary-home \
            --env CARGO_HOME=/tmp/n2-vocabulary-cargo \
            --env CARGO_TARGET_DIR=/workspace/wordService/target-debian \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/wordService \
            "$DEBIAN_BUILD_IMAGE" \
            cargo build --locked --release --bin n2-word-service-rust

      - name: Create deterministic release archive
        id: package
        env:
          MAX_GLIBC_VERSION: '2.36'
          RELEASE_BINARY: wordService/target-debian/release/n2-word-service-rust
          RELEASE_ID: ${{ steps.release.outputs.sha }}
          RELEASE_LABEL: ${{ steps.release.outputs.tag }}
        run: bash .github/scripts/package-word-service-release.sh

      - name: Transfer release and switch the server
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          RELEASE_ID: ${{ steps.release.outputs.sha }}
        run: bash .github/scripts/deploy-word-service-release.sh
