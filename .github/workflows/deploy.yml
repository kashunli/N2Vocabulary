name: Deploy WordService

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-word-service
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify, package, and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/n2-vocabulary' }}
      DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE || 'n2-word-service.service' }}
      DEPLOY_HEALTHCHECK_URL: ${{ vars.DEPLOY_HEALTHCHECK_URL || 'http://127.0.0.1:8767/api/summary' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Check out the exact pushed commit
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: wordService/frontend/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install locked frontend dependencies
        working-directory: wordService/frontend
        run: corepack pnpm install --frozen-lockfile

      - name: Run frontend tests
        working-directory: wordService/frontend
        run: pnpm test

      - name: Type-check frontend
        working-directory: wordService/frontend
        run: pnpm typecheck

      - name: Build frontend
        working-directory: wordService/frontend
        run: pnpm build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wordService -> target

      - name: Check Rust formatting
        run: cargo fmt --manifest-path wordService/Cargo.toml --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --manifest-path wordService/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path wordService/Cargo.toml

      - name: Build Linux release binary
        run: cargo build --manifest-path wordService/Cargo.toml --release --bin n2-word-service-rust

      - name: Create deterministic release archive
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail
          package_dir="$RUNNER_TEMP/n2-vocabulary-package"
          archive="$RUNNER_TEMP/n2-vocabulary-${GITHUB_SHA}.tar.gz"
          rm -rf "$package_dir" "$archive"
          mkdir -p "$package_dir/wordService/data" "$package_dir/wordService/static" "$package_dir/reviews/vocabulary_audio"

          install -Dm755 target/release/n2-word-service-rust "$package_dir/n2-word-service-rust"
          cp -a wordService/static/. "$package_dir/wordService/static/"
          install -Dm644 wordService/data/n2vocab.sqlite "$package_dir/wordService/data/n2vocab.sqlite"
          cp -a clips "$package_dir/clips"
          install -Dm644 reviews/vocabulary_audio/n2_all_both_candidates.json "$package_dir/reviews/vocabulary_audio/n2_all_both_candidates.json"
          install -Dm644 reviews/vocabulary_audio/n2_all_both.json "$package_dir/reviews/vocabulary_audio/n2_all_both.json"
          printf '%s\n' "$GITHUB_SHA" > "$package_dir/RELEASE"

          tar \
            --create \
            --gzip \
            --file "$archive" \
            --directory "$package_dir" \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            .
          archive_name=$(basename "$archive")
          (
            cd "$(dirname "$archive")"
            sha256sum "$archive_name" > "$archive.sha256"
          )
          cat "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$archive.sha256" >> "$GITHUB_OUTPUT"

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?Set production environment variable DEPLOY_HOST}"
          : "${DEPLOY_USER:?Set production environment variable DEPLOY_USER}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?Set production secret DEPLOY_SSH_PRIVATE_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Set production secret DEPLOY_KNOWN_HOSTS to the target SSH host key}"
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo 'DEPLOY_PORT must be numeric' >&2; exit 1; }
          [[ "$DEPLOY_ROOT" =~ ^/[A-Za-z0-9_-]+(/[A-Za-z0-9._-]+)*$ ]] || { echo 'DEPLOY_ROOT must be an absolute path without shell-special characters' >&2; exit 1; }
          [[ "$DEPLOY_SERVICE" =~ ^[A-Za-z0-9_.@-]+$ ]] || { echo 'DEPLOY_SERVICE contains unsupported characters' >&2; exit 1; }

      - name: Transfer release and switch the server
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          set -Eeuo pipefail
          key_file="$RUNNER_TEMP/n2-vocabulary-deploy-key"
          known_hosts_file="$RUNNER_TEMP/n2-vocabulary-known-hosts"
          remote_archive="/tmp/n2-vocabulary-${GITHUB_SHA}.tar.gz"
          remote_checksum="${remote_archive}.sha256"
          target="$DEPLOY_USER@$DEPLOY_HOST"

          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          ssh_opts=(-i "$key_file" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file")
          scp_opts=(-i "$key_file" -P "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file")

          ssh "${ssh_opts[@]}" "$target" "install -d -m 0755 '$DEPLOY_ROOT/incoming' '$DEPLOY_ROOT/releases'"
          scp "${scp_opts[@]}" "$ARCHIVE" "$target:$remote_archive"
          scp "${scp_opts[@]}" "$CHECKSUM" "$target:$remote_checksum"

          quoted_root=$(printf '%q' "$DEPLOY_ROOT")
          quoted_sha=$(printf '%q' "$GITHUB_SHA")
          quoted_archive=$(printf '%q' "$remote_archive")
          quoted_checksum=$(printf '%q' "$remote_checksum")
          quoted_service=$(printf '%q' "$DEPLOY_SERVICE")
          quoted_healthcheck=$(printf '%q' "$DEPLOY_HEALTHCHECK_URL")

          ssh "${ssh_opts[@]}" "$target" \
            "DEPLOY_ROOT=$quoted_root RELEASE_SHA=$quoted_sha REMOTE_ARCHIVE=$quoted_archive REMOTE_CHECKSUM=$quoted_checksum SERVICE=$quoted_service HEALTHCHECK_URL=$quoted_healthcheck bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          release_dir="$DEPLOY_ROOT/releases/$RELEASE_SHA"
          temporary_dir="$DEPLOY_ROOT/releases/.${RELEASE_SHA}.tmp"
          previous_target=''
          if [[ -L "$DEPLOY_ROOT/current" ]]; then
            previous_target=$(readlink "$DEPLOY_ROOT/current")
          fi

          if [[ -e "$release_dir" ]]; then
            echo "Release $RELEASE_SHA already exists; validating it instead of extracting again."
          else
            rm -rf "$temporary_dir"
            install -d -m 0755 "$temporary_dir"
            (
              cd "$(dirname "$REMOTE_ARCHIVE")"
              sha256sum --check "$(basename "$REMOTE_CHECKSUM")"
            )
            tar --extract --gzip --file "$REMOTE_ARCHIVE" --directory "$temporary_dir"
            test -x "$temporary_dir/n2-word-service-rust"
            test -f "$temporary_dir/wordService/data/n2vocab.sqlite"
            test -f "$temporary_dir/wordService/static/react-rail/index.html"
            mv "$temporary_dir" "$release_dir"
          fi

          ln -sfn "$release_dir" "$DEPLOY_ROOT/current.next"
          mv -Tf "$DEPLOY_ROOT/current.next" "$DEPLOY_ROOT/current"

          healthy() {
            sudo systemctl is-active --quiet "$SERVICE" && \
              curl --fail --silent --show-error --retry 20 --retry-delay 1 "$HEALTHCHECK_URL" >/dev/null
          }

          if ! sudo systemctl restart "$SERVICE" || ! healthy; then
            echo 'New release failed its service or health check; attempting rollback.' >&2
            if [[ -n "$previous_target" ]]; then
              ln -sfn "$previous_target" "$DEPLOY_ROOT/current.next"
              mv -Tf "$DEPLOY_ROOT/current.next" "$DEPLOY_ROOT/current"
              sudo systemctl restart "$SERVICE"
            fi
            exit 1
          fi

          rm -f "$REMOTE_ARCHIVE" "$REMOTE_CHECKSUM"
          echo "Deployment $RELEASE_SHA is healthy."
          REMOTE_SCRIPT
