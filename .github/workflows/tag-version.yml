name: Tag Main Version

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

concurrency:
  group: word-service-main-version-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Create and publish the next version tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push the next patch tag
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || {
            echo 'The checkout does not point at the pushed main commit.' >&2
            exit 1
          }

          git fetch --tags --force origin
          latest_tag=''
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_tag="$tag"
              break
            fi
          done < <(git tag --list 'v*' --sort=-version:refname)

          if [[ -z "$latest_tag" ]]; then
            next_tag='v0.1.0'
          else
            version="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "$version"
            next_patch=$((10#$patch + 1))
            next_tag="v${major}.${minor}.${next_patch}"
          fi

          if git show-ref --verify --quiet "refs/tags/$next_tag"; then
            echo "Version tag already exists: $next_tag" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$next_tag" "$GITHUB_SHA" --message "WordService $next_tag"
          git push origin "$next_tag"
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "Created and pushed $next_tag for $GITHUB_SHA"

      - name: Dispatch release and deploy workflows for the new tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_status=0
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG" \
            --field tag="$RELEASE_TAG" || release_status=$?

          deploy_status=0
          gh workflow run deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG" \
            --field tag="$RELEASE_TAG" || deploy_status=$?

          if ((release_status != 0 || deploy_status != 0)); then
            echo "Release dispatch status: $release_status" >&2
            echo "Deploy dispatch status: $deploy_status" >&2
            exit 1
          fi
