name: Build WordService Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: word-service-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, package, and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: |
            wordService/frontend/pnpm-lock.yaml
            wordService/mobile/pnpm-lock.yaml

      - name: Verify frontend
        working-directory: wordService/frontend
        run: pnpm install --frozen-lockfile && pnpm check

      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 36 is installed
        shell: bash
        run: sdkmanager --install "platforms;android-36"

      - name: Install mobile dependencies
        working-directory: wordService/mobile
        run: pnpm install --frozen-lockfile

      - name: Synchronize Capacitor Android project
        working-directory: wordService/mobile
        run: pnpm sync

      - name: Build Android release APK
        working-directory: wordService/mobile/android
        shell: bash
        run: bash gradlew assembleRelease --no-daemon --console=plain

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wordService -> target

      - name: Verify WordService
        working-directory: wordService
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test

      - name: Build Debian-compatible release binary
        working-directory: wordService
        shell: bash
        env:
          DEBIAN_BUILD_IMAGE: rust:1-bookworm
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp/n2-vocabulary-home \
            --env CARGO_HOME=/tmp/n2-vocabulary-cargo \
            --env CARGO_TARGET_DIR=/workspace/wordService/target-debian \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/wordService \
            "$DEBIAN_BUILD_IMAGE" \
            cargo build --locked --release --bin n2-word-service-rust

      - name: Create deterministic release archive
        id: package
        env:
          MAX_GLIBC_VERSION: '2.36'
          RELEASE_BINARY: wordService/target-debian/release/n2-word-service-rust
          RELEASE_LABEL: ${{ github.ref_name }}
        run: bash .github/scripts/package-word-service-release.sh

      - name: Name and checksum Android release APK
        id: android
        shell: bash
        env:
          RELEASE_LABEL: ${{ github.ref_name }}
        run: |
          apk="n2-vocabulary-android-${RELEASE_LABEL}.apk"
          checksum="${apk}.sha256"
          cp wordService/mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$checksum"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Publish downloadable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          APK: ${{ steps.android.outputs.apk }}
          APK_CHECKSUM: ${{ steps.android.outputs.checksum }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$CHECKSUM" "$APK" "$APK_CHECKSUM" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$CHECKSUM" "$APK" "$APK_CHECKSUM" \
              --target "$GITHUB_SHA" \
              --title "WordService $GITHUB_REF_NAME" \
              --generate-notes
          fi
