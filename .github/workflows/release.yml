name: Build WordService Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, for example v0.1.7
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: word-service-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, build, and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve and validate release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must use vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 1
          }
          release_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          [[ "$release_sha" == "$tag_sha" ]] || {
            echo "Checked-out commit does not match $RELEASE_TAG" >&2
            exit 1
          }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: |
            wordService/frontend/pnpm-lock.yaml
            wordService/mobile/pnpm-lock.yaml

      - name: Verify frontend
        working-directory: wordService/frontend
        run: pnpm install --frozen-lockfile && pnpm check

      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 36 is installed
        shell: bash
        run: sdkmanager --install "platforms;android-36"

      - name: Install mobile dependencies
        working-directory: wordService/mobile
        run: pnpm install --frozen-lockfile

      - name: Synchronize Capacitor Android project
        working-directory: wordService/mobile
        run: pnpm sync

      - name: Build Android release APK
        working-directory: wordService/mobile/android
        shell: bash
        run: bash gradlew assembleRelease --no-daemon --console=plain

      - name: Name Android release APK
        id: android
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -Eeuo pipefail
          apk="n2-vocabulary-android-${RELEASE_TAG}.apk"
          cp wordService/mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          test -s "$apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK-only GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.android.outputs.apk }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK" \
              --target "$RELEASE_SHA" \
              --title "WordService $RELEASE_TAG" \
              --generate-notes
          fi
