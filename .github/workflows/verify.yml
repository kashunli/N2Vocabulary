name: Verify WordService

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordService/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: wordService/frontend/pnpm-lock.yaml
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Run frontend tests
        run: pnpm test
      - name: Type-check frontend
        run: pnpm typecheck
      - name: Build frontend
        run: pnpm build
      - name: Reject stale committed frontend assets
        working-directory: .
        run: git diff --exit-code -- wordService/static/react-rail

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wordService -> target
      - name: Check formatting
        run: cargo fmt --manifest-path wordService/Cargo.toml --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --manifest-path wordService/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        run: cargo test --manifest-path wordService/Cargo.toml
